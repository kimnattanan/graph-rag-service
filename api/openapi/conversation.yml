openapi: "3.0.0"
info:
  version: 1.0.0
  title: Graph RAG Service - Conversation
  description: Conversation and message storage with retrieval-augmented generation.
servers:
  - url: https://{hostname}/api
    variables:
      hostname:
        default: localhost
security:
  - bearerAuth: []
paths:
  /conversations:
    get:
      operationId: listConversations
      summary: List the authenticated user's conversations (requires conversation:ask)
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createConversation
      summary: Create an empty conversation (requires conversation:ask)
      description: Command. Returns no body. Read the conversation with getConversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '204':
          description: Conversation created
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Get a conversation with its messages (requires conversation:ask)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      operationId: deleteConversation
      summary: Delete a conversation and its messages (requires conversation:ask)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Conversation deleted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      summary: List messages in a conversation (requires conversation:ask)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: sendMessage
      summary: Send a user message (requires conversation:ask)
      description: Command. Stores the user message, retrieves context from Knowledge, calls the LLM, and stores the assistant message. Returns no body. Read the messages with listMessages or getConversation.
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '204':
          description: Message accepted
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /conversations/{conversationId}/messages/{messageId}:
    get:
      operationId: getMessage
      summary: Get a single message (requires conversation:ask)
      parameters:
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: messageId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Message details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateConversationRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated conversation id
        title:
          type: string
          description: Optional title; auto-generated from the first message if omitted when a message is sent

    SendMessageRequest:
      type: object
      required: [id, content]
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated id for the user message
        content:
          type: string
          minLength: 1
        topK:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
          description: Number of knowledge chunks to retrieve
        tags:
          type: array
          items:
            type: string
          description: Optional tag filter passed to Knowledge retrieval
        historyCapacity:
          type: integer
          minimum: 0
          maximum: 100
          default: 3
          description: Number of most recent messages in the conversation to include as LLM context

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationSummary:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/Message'

    ConversationList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationSummary'
        total:
          type: integer

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
          description: Present on assistant messages when retrieval was used
        createdAt:
          type: string
          format: date-time

    MessageList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        total:
          type: integer

    Source:
      type: object
      required: [documentId, documentTitle, text, score]
      properties:
        documentId:
          type: string
          format: uuid
        documentTitle:
          type: string
        chunkId:
          type: string
        text:
          type: string
        score:
          type: number
          format: float

    Error:
      type: object
      required:
        - slug
        - message
      properties:
        slug:
          type: string
        message:
          type: string
